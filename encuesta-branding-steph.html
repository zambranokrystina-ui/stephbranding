<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu marca: cuéntame cómo la ves</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Paleta Mentes Abundantes, con tonos de texto verificados ── */
  :root{
    --navy:#1B2A4A;
    --naranja:#CC5E22;        /* relleno y formas */
    --naranja-txt:#BC561F;    /* texto y botones, 4.68:1 */
    --naranja-hover:#934418;
    --oliva:#7A9455;          /* relleno */
    --oliva-txt:#667C47;      /* texto, 4.63:1 */
    --dorado:#C9A84C;         /* relleno */
    --dorado-txt:#886F29;     /* texto, 4.82:1 */
    --crema:#F0E8D4;
    --hueso:#FBFAF6;
    --linea:#E8E4DA;
    --gris:#5A6478;
    --blanco:#FFFFFF;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--blanco);
    font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;
    color:var(--navy);
    font-size:16px;
    line-height:1.55;
    -webkit-text-size-adjust:100%;
  }

  .marco{max-width:660px;margin:0 auto;padding:0 20px 56px}

  /* ── Cabecera ── */
  .cab{padding:26px 0 0}
  .marca{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:19px;color:var(--navy)}
  .sello{font-size:10.5px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--oliva-txt);margin-top:2px}
  .barra-fila{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;gap:16px}
  .paso{font-size:12px;font-weight:700;color:var(--naranja-txt);white-space:nowrap}
  .barra{height:4px;background:var(--linea);border-radius:3px;overflow:hidden;margin-top:12px}
  .barra i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--naranja),var(--dorado));transition:width .55s cubic-bezier(.4,0,.2,1)}

  /* ── Bienvenida ── */
  .bien{text-align:center;padding:34px 0 0}
  .disco{width:84px;height:84px;border-radius:50%;margin:0 auto 24px;padding:3px;
    background:conic-gradient(from 45deg,var(--naranja),var(--dorado),var(--oliva),var(--navy),var(--naranja));}
  .disco span{display:flex;width:100%;height:100%;border-radius:50%;background:var(--crema);
    align-items:center;justify-content:center;font-size:33px;line-height:1}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:32px;line-height:1.16;margin:0 0 10px}
  .entrada{font-size:16.5px;color:var(--gris);line-height:1.7;max-width:460px;margin:0 auto 22px}
  .pastilla{display:inline-flex;align-items:center;gap:8px;background:rgba(122,148,85,.1);
    color:var(--oliva-txt);font-size:14px;font-weight:600;padding:9px 18px;border-radius:11px}
  .avisos{text-align:left;max-width:480px;margin:28px auto 0}
  .avisos p{font-size:14.5px;color:var(--gris);line-height:1.65;margin:0 0 10px;padding-left:18px;position:relative}
  .avisos p:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--dorado)}

  /* ── Secciones ── */
  .sec-cab{margin:30px 0 26px}
  .sec-num{font-size:10.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--oliva-txt);margin-bottom:7px}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:28px;line-height:1.2;margin:0 0 6px}
  .sec-sub{font-size:15px;color:var(--gris);margin:0}

  .preg{margin-bottom:34px}
  .etq{display:block;font-size:16.5px;font-weight:600;line-height:1.45;margin-bottom:5px}
  .ayuda{font-size:13.5px;color:var(--gris);margin:0 0 12px;line-height:1.5}

  input[type=text],textarea{
    width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--linea);
    font-family:inherit;font-size:16px;color:var(--navy);background:var(--hueso);
    outline:none;transition:border-color .2s,background .2s;
  }
  textarea{min-height:92px;resize:vertical;line-height:1.55}
  input[type=text]:focus,textarea:focus{border-color:var(--naranja);background:var(--blanco)}

  /* Opciones */
  .ops{display:flex;flex-direction:column;gap:8px}
  .op{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
    padding:13px 16px;border-radius:12px;cursor:pointer;
    border:1.5px solid var(--linea);background:var(--hueso);
    font-family:inherit;font-size:15.5px;line-height:1.45;color:var(--navy);
    transition:border-color .2s,background .2s,box-shadow .2s}
  .op:hover{border-color:#CFC9BC}
  .op.on{border-color:var(--naranja);background:rgba(204,94,34,.055);font-weight:600;
    box-shadow:0 2px 10px rgba(204,94,34,.1)}
  .op.off{opacity:.45}
  .caja{flex:0 0 auto;width:21px;height:21px;border:2px solid #C3BDB0;background:var(--blanco);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--blanco);
    margin-top:1px;transition:all .18s}
  .r .caja{border-radius:50%}
  .c .caja{border-radius:6px}
  .op.on .caja{border-color:var(--naranja);background:var(--naranja)}
  .tope{font-size:12.5px;color:var(--dorado-txt);font-weight:600;margin-top:9px}

  /* Rejilla compacta para listas largas */
  .ops.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:540px){.ops.rejilla{grid-template-columns:1fr}}

  /* Escalas de opuestos */
  .esc{border:1.5px solid var(--linea);border-radius:14px;overflow:hidden;background:var(--hueso)}
  .esc-f{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    padding:13px 15px;border-bottom:1px solid var(--linea)}
  .esc-f:last-child{border-bottom:0}
  .esc-f .izq{font-size:14.5px;text-align:right;color:var(--navy)}
  .esc-f .der{font-size:14.5px;text-align:left;color:var(--navy)}
  .puntos{display:flex;gap:7px}
  .pt{width:26px;height:26px;border-radius:50%;border:2px solid #C3BDB0;background:var(--blanco);
    cursor:pointer;padding:0;transition:all .16s;font-size:0}
  .pt:hover{border-color:#A79F8E}
  .pt.on{border-color:var(--naranja);background:var(--naranja);transform:scale(1.1)}
  @media(max-width:480px){
    .esc-f{grid-template-columns:1fr;gap:7px;text-align:center}
    .esc-f .izq,.esc-f .der{text-align:center;font-size:14px;font-weight:600}
    .puntos{justify-content:center}
  }

  /* ── Navegación ── */
  .nav{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding-top:22px;border-top:1px solid var(--linea);margin-top:8px}
  .btn{font-family:inherit;font-size:15.5px;font-weight:600;padding:13px 26px;border-radius:12px;
    cursor:pointer;border:0;transition:background .2s,box-shadow .2s}
  .btn-sec{background:var(--blanco);border:1.5px solid var(--linea);color:var(--navy)}
  .btn-sec:hover{border-color:#CFC9BC}
  .btn-pri{background:var(--naranja-txt);color:var(--blanco);box-shadow:0 3px 13px rgba(188,86,31,.26)}
  .btn-pri:hover{background:var(--naranja-hover)}
  .btn-pri:disabled{background:var(--linea);color:#8B8575;box-shadow:none;cursor:not-allowed}
  .btn[hidden]{display:none}

  /* ── Enviando / fin ── */
  .centro{text-align:center;padding:56px 0 30px}
  .rueda{width:54px;height:54px;margin:0 auto 22px;border:3px solid var(--crema);
    border-top-color:var(--naranja);border-radius:50%;animation:gira .85s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .tilde{width:66px;height:66px;margin:0 auto 22px;border-radius:50%;background:rgba(122,148,85,.13);
    display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--oliva-txt)}
  .fin-txt{font-size:16.5px;color:var(--gris);line-height:1.7;max-width:420px;margin:0 auto}
  .pie{text-align:center;font-size:12.5px;color:#9A9486;margin-top:34px}
  .error{background:rgba(204,94,34,.07);border-left:3px solid var(--naranja);
    padding:14px 16px;border-radius:0 10px 10px 0;font-size:14.5px;margin-bottom:18px}
  .error[hidden]{display:none}
</style>
</head>
<body>

<div class="marco">

  <!-- ══ CABECERA ══ -->
  <div class="cab">
    <div class="marca">Mentes Abundantes</div>
    <div class="sello">Encuesta de marca</div>
    <div class="barra-fila">
      <div></div>
      <div class="paso" id="paso"></div>
    </div>
    <div class="barra"><i id="progreso"></i></div>
  </div>

  <!-- ══ CONTENIDO ══ -->
  <div id="lienzo"></div>

  <!-- ══ NAVEGACIÓN ══ -->
  <div class="nav" id="nav">
    <button class="btn btn-sec" id="atras" type="button">← Anterior</button>
    <button class="btn btn-pri" id="siguiente" type="button">Comenzar →</button>
  </div>

  <div class="pie">Desarrollado por Mercadeo MRR LLC</div>
</div>

<script>
/* ════════════════════════════════════════════════════
   PEGA AQUÍ LA URL DE TU APPS SCRIPT (termina en /exec)
   ════════════════════════════════════════════════════ */
var ENDPOINT = 'PEGAR_URL_APPS_SCRIPT_AQUI';

/* ── Definición de la encuesta ── */
var PARES = [
  ['Clásica','Moderna'],

var SECCIONES = [
  { id:'intro' },

  { id:'s1', num:'Sección 1 de 6', titulo:'Tu emprendimiento en tus palabras',
    sub:'Antes de hablar de colores, quiero oírte describirlo tú.',
    preguntas:[
      {id:'p1', tipo:'parrafo', texto:'Si una desconocida te pregunta en una fiesta qué haces, ¿qué le contestas?',

       ph:'“Pues yo…”'},
      {id:'p2', tipo:'parrafo', texto:'¿A quién le sirve lo que haces?',
       ayuda:'Descríbela como si fuera una sola persona, no un grupo.',
       ph:'Es una mujer que…'},
      {id:'p3', tipo:'parrafo', texto:'¿Qué hace esa persona hoy, sin ti, para resolver lo que tú resolverías?',

    preguntas:[

       ph:'Sería una mujer de…'},
      {id:'p7', tipo:'radio', texto:'Esa persona, ¿te habla de tú o de usted?',
       ops:['De tú, como una amiga','De tú, pero con respeto','De usted, profesional','Depende de a quién le hable']},
      {id:'p8', tipo:'radio', texto:'¿Cuál de estas te suena más a ti?',
       ops:['“Yo te enseño” — soy la que sabe y te transmito',
            '“Vamos juntas” — te acompaño mientras aprendes',
            '“Tú puedes” — te empujo y te sostengo',
            '“Mira lo que descubrí” — comparto lo que voy aprendiendo']},
      {id:'p9', tipo:'check', max:4, rejilla:true,
       texto:'Elige hasta 4 palabras que quieres que la gente use para describir tu marca.',
       ops:['Profesional','Cálida','Confiable','Clara','Moderna','Humana','Rigurosa','Cercana',
            'Elegante','Práctica','Valiente','Serena','Fuerte','Honesta','Sencilla','Luminosa']},
      {id:'p10', tipo:'check', max:4, rejilla:true,
       texto:'Y ahora hasta 4 palabras que NO quieres que nadie use para describirla.',
       ayuda:'Esta lista se vuelve mi filtro cuando te presente propuestas.',
       ops:['Cursi','Fría','Aburrida','Pretenciosa','Infantil','Agresiva','Genérica','Complicada',
            'Barata','Exagerada','Corporativa','Espiritual','Desordenada','Dramática','Llamativa','Anticuada']}
    ]},

  { id:'s3', num:'Sección 3 de 6', titulo:'El nombre',
    sub:'Aquí no hay que decidir nada. Solo quiero ver todo lo que has pensado.',
    preguntas:[
      {id:'p11', tipo:'parrafo', texto:'¿Ya tienes nombres en mente? Escríbelos todos, aunque te parezcan malos.',
       ayuda:'En serio, hasta los que descartaste. Un nombre malo suele tener dentro la palabra correcta.',
       ph:'Uno por línea…'},
      {id:'p12', tipo:'radio', texto:'¿Quieres que tu nombre propio sea parte de la marca?',
       ops:['Sí, quiero que sea mi nombre','Sí, pero acompañado de algo más',
            'No, prefiero un nombre aparte de mí','No sé, decidámoslo juntas']},
      {id:'p13', tipo:'radio', texto:'¿En qué idioma quieres el nombre?',
       ops:['En español','En inglés','Una mezcla de los dos',
            'Una palabra que funcione igual en los dos idiomas','No me importa']},
      {id:'p14', tipo:'parrafo', texto:'¿Qué palabras NO quieres que aparezcan en tu nombre ni en tu marca?',
       ph:'No quiero que diga…'},
      {id:'p15', tipo:'corto', texto:'Cuando alguien escuche el nombre de tu marca por primera vez, ¿qué quieres que piense?',
       ph:'Que piense…'},
      {id:'p16', tipo:'corto', texto:'¿Hay alguna palabra que sientas muy tuya?',
       ayuda:'Puede ser una que uses mucho, o una que signifique algo para ti.'}
    ]},

  { id:'s4', num:'Sección 4 de 6', titulo:'Colores',
    sub:'No tienes que armar una paleta. Solo dime qué te atrae y qué te repele.',
    preguntas:[
      {id:'p17', tipo:'check', rejilla:true, texto:'¿Qué colores te atraen para tu marca?',
       ayuda:'Elige todos los que quieras.',
       ops:['Azul profundo / marino','Azul claro / celeste','Verde oscuro / bosque','Verde suave / salvia',
            'Terracota / tierra','Mostaza / ocre','Dorado','Vino / borgoña','Morado / violeta',
            'Rosa suave','Naranja','Negro','Gris','Crema / beige','Blanco']},
      {id:'p18', tipo:'corto', texto:'De los que elegiste, ¿cuál sería el principal?'},
      {id:'p19', tipo:'check', rejilla:true, texto:'¿Qué colores NO quieres ver nunca en tu marca?',
       ayuda:'Esto se vuelve una regla fija de tu manual de marca.',
       ops:['Rosa','Morado','Amarillo','Naranja','Rojo','Verde brillante','Turquesa','Negro',
            'Dorado','Colores pastel','Colores neón','Ninguno, estoy abierta']},
      {id:'p20', tipo:'parrafo', texto:'¿Hay algún color que tenga un significado personal para ti? ¿Cuál y por qué?'},
      {id:'p21', tipo:'radio', texto:'¿Cómo quieres que se sienta tu paleta?',
       ops:['Sobria, con pocos colores y mucho espacio en blanco','Cálida, con tonos de tierra',
            'Fresca y luminosa','Fuerte y con contraste','Suave y tranquila']}
    ]},

  { id:'s5', num:'Sección 5 de 6', titulo:'Estética visual',
    sub:'Aquí sí te voy a pedir que busques ejemplos.',
    preguntas:[
      {id:'escalas', tipo:'escalas',
       texto:'¿Hacia qué lado se inclina tu marca?',
       ayuda:'Nueve pares de opuestos. Marca el punto donde la sientes. Si está justo en medio, marca el del centro.'},
      {id:'p23', tipo:'parrafo',
       texto:'Pega 3 a 5 enlaces de cuentas de Instagram, sitios web o tableros de Pinterest que te gusten visualmente.',

       ph:'instagram.com/…  — me gusta porque…'},
      {id:'p24', tipo:'parrafo', texto:'¿Y alguna que NO te guste? Pega el enlace y dime qué te choca.',
       ayuda:'Esta es de las que más me sirven.'},
      {id:'p25', tipo:'radio', texto:'¿Qué tipo de letra te atrae más?',
       ops:['Con remates clásicos, tipo libro','Limpia y sin remates, tipo moderna',
            'Escrita a mano o caligráfica','Una mezcla: títulos clásicos, texto moderno',
            'No tengo idea, decídelo tú']},
      {id:'p26', tipo:'radio', texto:'En tus publicaciones y en tu página, ¿qué prefieres ver?',
       ops:['Fotos mías, mi cara','Fotos de personas, pero no necesariamente yo',
            'Ilustraciones o dibujos','Solo tipografía y colores, sin fotos','Una mezcla']}

  { id:'s6', num:'Sección 6 de 6', titulo:'Lo práctico',
    sub:'Las últimas dos.',
    preguntas:[
      {id:'p27', tipo:'check', rejilla:true, texto:'¿Dónde vas a usar tu marca primero?',
       ayuda:'Elige todo lo que aplique.',
       ops:['Instagram y TikTok','Una página web','Tarjetas de presentación',
            'Presentaciones o PDF para alumnas','Correos','Volantes impresos',
            'Un logo para firmar documentos','Todavía no sé']},
      {id:'p28', tipo:'parrafo', texto:'¿Hay algo más que quieras que yo sepa antes de empezar?'}
    ]},

  { id:'fin' }
];

/* ── Estado ── */
var paso = 0;
var R = {};            // respuestas
var ESC = {};          // escalas: esc1..esc9
var enviado = false;

var lienzo   = document.getElementById('lienzo');
var elPaso   = document.getElementById('paso');
var elProg   = document.getElementById('progreso');
var btnAtras = document.getElementById('atras');
var btnSig   = document.getElementById('siguiente');
var elNav    = document.getElementById('nav');

var TOTAL_SEC = 6; // secciones de preguntas

/* ── Utilidades ── */
function crear(tag, clase, texto){
  var e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function pedirSubida(){
  try { parent.postMessage({ rbjSubir:true }, '*'); } catch(e){}
  try { window.scrollTo(0,0); } catch(e){}
}

/* ── Render ── */
function pintar(){
  var s = SECCIONES[paso];
  lienzo.innerHTML = '';

  if (s.id === 'intro'){ pintarIntro(); }
  else if (s.id === 'fin'){ pintarEnvio(); }
  else { pintarSeccion(s); }

  // Cabecera
  if (s.id === 'intro' || s.id === 'fin'){
    elPaso.textContent = '';
    elProg.style.width = (s.id === 'fin' ? 100 : 0) + '%';
  } else {
    elPaso.textContent = paso + ' / ' + TOTAL_SEC;
    elProg.style.width = ((paso - 1) / TOTAL_SEC * 100 + (100 / TOTAL_SEC) * 0.15) + '%';
  }

  // Navegación
  if (s.id === 'fin'){
    elNav.style.display = 'none';
  } else {
    elNav.style.display = 'flex';
    btnAtras.hidden = (paso === 0);
    btnSig.textContent = (s.id === 'intro') ? 'Comenzar →'
                       : (paso === SECCIONES.length - 2) ? 'Enviar mis respuestas ✦'
                       : 'Siguiente →';
    revisarSig();
  }
  pedirSubida();
}

function pintarIntro(){
  var w = crear('div','bien');

  var d = crear('div','disco'); var sp = crear('span','', '✦'); d.appendChild(sp); w.appendChild(d);

  var h = crear('h1'); h.textContent = 'Tu marca: cuéntame cómo la ves'; w.appendChild(h);

  var e = crear('p','entrada');
  e.textContent = 'Steph, esto es tarea para antes de nuestra sesión de marca. No hay respuestas ' +
                  'correctas y no necesitas saber nada de diseño.';
  w.appendChild(e);

  var pl = crear('div','pastilla','⏱ 20–25 minutos'); w.appendChild(pl);

  var av = crear('div','avisos');
  [
    'Solo necesito saber cómo ves tú tu marca, qué te gusta y sobre todo qué no quieres.',
    'Si una pregunta no la sabes contestar, déjala en blanco. Eso también me dice algo.',
    'Puedes ir y volver entre secciones con los botones de abajo.',
    'Lo único que te pido obligatorio es tu nombre, al final.'
  ].forEach(function(t){ av.appendChild(crear('p','',t)); });
  w.appendChild(av);

  lienzo.appendChild(w);
}

function pintarSeccion(s){
  var cab = crear('div','sec-cab');
  cab.appendChild(crear('div','sec-num', s.num));
  var h = crear('h2'); h.textContent = s.titulo; cab.appendChild(h);
  if (s.sub) cab.appendChild(crear('p','sec-sub', s.sub));
  lienzo.appendChild(cab);

  s.preguntas.forEach(function(q){
    var caja = crear('div','preg');
    var lab = crear('label','etq', q.texto); caja.appendChild(lab);
    if (q.ayuda) caja.appendChild(crear('p','ayuda', q.ayuda));

    if (q.tipo === 'corto'){
      var i = document.createElement('input');
      i.type = 'text'; i.value = R[q.id] || ''; i.placeholder = q.ph || '';
      i.addEventListener('input', function(){ R[q.id] = i.value; });
      caja.appendChild(i);
    }

    else if (q.tipo === 'parrafo'){
      var t = document.createElement('textarea');
      t.value = R[q.id] || ''; t.placeholder = q.ph || '';
      t.addEventListener('input', function(){ R[q.id] = t.value; });
      caja.appendChild(t);
    }

    else if (q.tipo === 'radio'){
      var ct = crear('div','ops' + (q.rejilla ? ' rejilla' : ''));
      q.ops.forEach(function(txt){
        var b = crear('button','op r'); b.type = 'button';
        b.appendChild(crear('span','caja', R[q.id] === txt ? '✓' : ''));
        b.appendChild(crear('span','', txt));
        if (R[q.id] === txt) b.classList.add('on');
        b.addEventListener('click', function(){
          R[q.id] = (R[q.id] === txt) ? '' : txt;
          pintarSeccionSuave(s);
        });
        ct.appendChild(b);
      });
      caja.appendChild(ct);
    }

    else if (q.tipo === 'check'){
      var sel = R[q.id] || [];
      var ct2 = crear('div','ops' + (q.rejilla ? ' rejilla' : ''));
      q.ops.forEach(function(txt){
        var marcado = sel.indexOf(txt) !== -1;
        var lleno = q.max && sel.length >= q.max && !marcado;
        var b = crear('button','op c'); b.type = 'button';
        b.appendChild(crear('span','caja', marcado ? '✓' : ''));
        b.appendChild(crear('span','', txt));
        if (marcado) b.classList.add('on');
        if (lleno) b.classList.add('off');
        b.addEventListener('click', function(){
          var a = (R[q.id] || []).slice();
          var k = a.indexOf(txt);
          if (k !== -1) a.splice(k,1);
          else { if (q.max && a.length >= q.max) return; a.push(txt); }
          R[q.id] = a;
          pintarSeccionSuave(s);
        });
        ct2.appendChild(b);
      });
      caja.appendChild(ct2);
      if (q.max){
        caja.appendChild(crear('div','tope',
          sel.length + ' de ' + q.max + ' seleccionadas'));
      }
    }

    else if (q.tipo === 'escalas'){
      var box = crear('div','esc');
      PARES.forEach(function(par, i){
        var k = 'esc' + (i+1);
        var f = crear('div','esc-f');
        f.appendChild(crear('div','izq', par[0]));
        var pts = crear('div','puntos');
        for (var v = 1; v <= 5; v++){
          (function(v){
            var b = crear('button','pt' + (ESC[k] === v ? ' on' : ''));
            b.type = 'button';
            b.setAttribute('aria-label', par[0] + ' a ' + par[1] + ', nivel ' + v);
            b.addEventListener('click', function(){
              ESC[k] = (ESC[k] === v) ? 0 : v;
              pintarSeccionSuave(s);
            });
            pts.appendChild(b);
          })(v);
        }
        f.appendChild(pts);
        f.appendChild(crear('div','der', par[1]));
        box.appendChild(f);
      });
      caja.appendChild(box);
    }

    lienzo.appendChild(caja);
  });

  // Nombre obligatorio en la última sección de preguntas
  if (s.id === 's6'){
    var cn = crear('div','preg');
    cn.appendChild(crear('label','etq','Tu nombre'));
    cn.appendChild(crear('p','ayuda','Para que yo sepa que llegó la tuya.'));
    var inn = document.createElement('input');
    inn.type = 'text'; inn.value = R.nombre || ''; inn.placeholder = 'Nombre y apellido';
    inn.addEventListener('input', function(){ R.nombre = inn.value; revisarSig(); });
    cn.appendChild(inn);
    lienzo.appendChild(cn);
  }
}

/* Redibuja la sección manteniendo la posición de lectura */
function pintarSeccionSuave(s){
  var y = 0;
  try { y = window.pageYOffset || 0; } catch(e){}
  lienzo.innerHTML = '';
  pintarSeccion(s);
  revisarSig();
  try { window.scrollTo(0, y); } catch(e){}
}

function revisarSig(){
  var s = SECCIONES[paso];
  if (s.id === 's6'){
    btnSig.disabled = !(R.nombre && R.nombre.trim().length > 1);
  } else {
    btnSig.disabled = false;
  }
}

/* ── Envío por lotes (evita el límite de longitud de una URL GET) ── */
function pintarEnvio(){
  var w = crear('div','centro');
  w.appendChild(crear('div','rueda'));
  var h = crear('h2'); h.textContent = 'Enviando tus respuestas…'; w.appendChild(h);
  w.appendChild(crear('p','fin-txt','Un momento, no cierres esta página.'));
  lienzo.appendChild(w);
  if (!enviado){ enviado = true; enviar(); }
}

function pintarFin(ok){
  lienzo.innerHTML = '';
  var w = crear('div','centro');
  var t = crear('div','tilde','✓'); w.appendChild(t);
  var h = crear('h2');
  h.textContent = ok ? '¡Gracias, ' + (R.nombre || '').split(' ')[0] + '!' : 'Listo';
  w.appendChild(h);
  var p1 = crear('p','fin-txt');
  p1.textContent = ok
    ? 'Con esto ya puedo trabajar. Voy a leer todo con calma antes de nuestra sesión. ' +
      'No te preocupes por lo que dejaste en blanco: eso lo resolvemos juntas.'
    : 'Tus respuestas quedaron registradas. Si algo no llegó, Krystina te escribe.';
  w.appendChild(p1);
  lienzo.appendChild(w);
  elNav.style.display = 'none';
  pedirSubida();
}

function lotes(){
  // Un objeto por lote, cada uno bajo ~1.200 caracteres al codificar
  var id = 'st-' + Date.now() + '-' + Math.floor(Math.random()*9000+1000);
  var L = [];

  function multi(v){ return (v && v.length) ? v.join(' | ') : ''; }

  L.push({ nombre:R.nombre||'', p4:R.p4||'', p7:R.p7||'', p8:R.p8||'',
           p9:multi(R.p9), p10:multi(R.p10) });
  L.push({ p1:R.p1||'', p2:R.p2||'' });
  L.push({ p3:R.p3||'', p5:R.p5||'' });
  L.push({ p6:R.p6||'', p11:R.p11||'' });
  L.push({ p12:R.p12||'', p13:R.p13||'', p14:R.p14||'', p15:R.p15||'', p16:R.p16||'' });
  L.push({ p17:multi(R.p17), p18:R.p18||'', p19:multi(R.p19), p21:R.p21||'' });
  L.push({ p20:R.p20||'' });
  var e = {};
  for (var i=1;i<=9;i++) e['esc'+i] = ESC['esc'+i] || '';
  e.p25 = R.p25||''; e.p26 = R.p26||''; e.p27 = multi(R.p27);
  L.push(e);
  L.push({ p23:R.p23||'' });
  L.push({ p24:R.p24||'' });
  L.push({ p28:R.p28||'', fin:'1' });

  return L.map(function(o){ o.id = id; return o; });
}

function aQuery(o){
  var partes = [];
  for (var k in o){ if (Object.prototype.hasOwnProperty.call(o,k)){
    partes.push(encodeURIComponent(k) + '=' + encodeURIComponent(String(o[k]).slice(0,1800)));
  }}
  partes.push('t=' + Date.now());
  return partes.join('&');
}

function enviar(){
  if (!ENDPOINT || ENDPOINT.indexOf('PEGAR_URL') === 0){
    // Sin backend configurado: no dejamos a la persona colgada
    setTimeout(function(){ pintarFin(false); }, 900);
    return;
  }
  var L = lotes();
  var i = 0;
  var cerrado = false;

  function terminar(ok){
    if (cerrado) return;
    cerrado = true;
    pintarFin(ok !== false);
  }

  function siguienteLote(){
    if (i >= L.length){ terminar(true); return; }
    var o = L[i++];
    var ping = new Image();
    var listo = false;
    function paso2(){ if (listo) return; listo = true; setTimeout(siguienteLote, 60); }
    ping.onload  = paso2;
    ping.onerror = paso2;   // Apps Script devuelve texto, onerror es el caso normal
    ping.src = ENDPOINT + '?' + aQuery(o);
    setTimeout(paso2, 3500); // respaldo por lote
  }

  siguienteLote();
  setTimeout(function(){ terminar(true); }, 42000); // respaldo global
}

/* ── Navegación ── */
btnSig.addEventListener('click', function(){
  if (btnSig.disabled) return;
  if (paso < SECCIONES.length - 1){ paso++; pintar(); }
});
btnAtras.addEventListener('click', function(){
  if (paso > 0){ paso--; pintar(); }
});

/* ── Altura del iframe: medir el BODY, nunca documentElement ── */
(function(){
  var ultimo = 0;
  function alto(){
    var h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h > 400 && Math.abs(h - ultimo) > 2){
      ultimo = h;
      try { parent.postMessage({ rbjAltura:h }, '*'); } catch(e){}
    }
  }
  window.addEventListener('load', alto);
  window.addEventListener('resize', alto);
  setInterval(alto, 800);
})();

pintar();
</script>
