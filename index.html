<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de tu oferta de valor</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Paleta Mentes Abundantes, con tonos de texto verificados ── */
  :root{
    --navy:#1B2A4A;
    --naranja:#CC5E22;        /* relleno y formas */
    --naranja-txt:#BC561F;    /* texto y botones, 4.68:1 */
    --naranja-hover:#934418;
    --oliva:#7A9455;          /* relleno */
    --oliva-txt:#667C47;      /* texto, 4.63:1 */
    --dorado:#C9A84C;         /* relleno */
    --dorado-txt:#886F29;     /* texto, 4.82:1 */
    --crema:#F0E8D4;
    --hueso:#FBFAF6;
    --linea:#E8E4DA;
    --gris:#5A6478;
    --blanco:#FFFFFF;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--blanco);
    font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;
    color:var(--navy);
    font-size:16px;
    line-height:1.55;
    -webkit-text-size-adjust:100%;
  }

  .marco{max-width:660px;margin:0 auto;padding:0 20px 56px}

  /* ── Cabecera ── */
  .cab{padding:26px 0 0}
  .marca{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:19px;color:var(--navy)}
  .sello{font-size:10.5px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--oliva-txt);margin-top:2px}
  .barra-fila{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;gap:16px}
  .paso{font-size:12px;font-weight:700;color:var(--naranja-txt);white-space:nowrap}
  .barra{height:4px;background:var(--linea);border-radius:3px;overflow:hidden;margin-top:12px}
  .barra i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--naranja),var(--dorado));transition:width .55s cubic-bezier(.4,0,.2,1)}

  /* ── Bienvenida ── */
  .bien{text-align:center;padding:34px 0 0}
  .disco{width:84px;height:84px;border-radius:50%;margin:0 auto 24px;padding:3px;
    background:conic-gradient(from 45deg,var(--naranja),var(--dorado),var(--oliva),var(--navy),var(--naranja));}
  .disco span{display:flex;width:100%;height:100%;border-radius:50%;background:var(--crema);
    align-items:center;justify-content:center;font-size:33px;line-height:1}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:32px;line-height:1.16;margin:0 0 10px}
  .entrada{font-size:16.5px;color:var(--gris);line-height:1.7;max-width:460px;margin:0 auto 22px}
  .pastilla{display:inline-flex;align-items:center;gap:8px;background:rgba(122,148,85,.1);
    color:var(--oliva-txt);font-size:14px;font-weight:600;padding:9px 18px;border-radius:11px}
  .avisos{text-align:left;max-width:480px;margin:28px auto 0}
  .avisos p{font-size:14.5px;color:var(--gris);line-height:1.65;margin:0 0 10px;padding-left:18px;position:relative}
  .avisos p:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--dorado)}

  /* ── Secciones ── */
  .sec-cab{margin:30px 0 26px}
  .sec-num{font-size:10.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--oliva-txt);margin-bottom:7px}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:28px;line-height:1.2;margin:0 0 6px}
  .sec-sub{font-size:15px;color:var(--gris);margin:0}

  .preg{margin-bottom:34px}
  .etq{display:block;font-size:16.5px;font-weight:600;line-height:1.45;margin-bottom:5px}
  .ayuda{font-size:13.5px;color:var(--gris);margin:0 0 12px;line-height:1.5}

  input[type=text],textarea{
    width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--linea);
    font-family:inherit;font-size:16px;color:var(--navy);background:var(--hueso);
    outline:none;transition:border-color .2s,background .2s;
  }
  textarea{min-height:92px;resize:vertical;line-height:1.55}
  input[type=text]:focus,textarea:focus{border-color:var(--naranja);background:var(--blanco)}

  /* Opciones */
  .ops{display:flex;flex-direction:column;gap:8px}
  .op{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
    padding:13px 16px;border-radius:12px;cursor:pointer;
    border:1.5px solid var(--linea);background:var(--hueso);
    font-family:inherit;font-size:15.5px;line-height:1.45;color:var(--navy);
    transition:border-color .2s,background .2s,box-shadow .2s}
  .op:hover{border-color:#CFC9BC}
  .op.on{border-color:var(--naranja);background:rgba(204,94,34,.055);font-weight:600;
    box-shadow:0 2px 10px rgba(204,94,34,.1)}
  .op.off{opacity:.45}
  .caja{flex:0 0 auto;width:21px;height:21px;border:2px solid #C3BDB0;background:var(--blanco);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--blanco);
    margin-top:1px;transition:all .18s}
  .r .caja{border-radius:50%}
  .c .caja{border-radius:6px}
  .op.on .caja{border-color:var(--naranja);background:var(--naranja)}
  .tope{font-size:12.5px;color:var(--dorado-txt);font-weight:600;margin-top:9px}

  /* Rejilla compacta para listas largas */
  .ops.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:540px){.ops.rejilla{grid-template-columns:1fr}}

  /* Escalas de opuestos */
  .esc{border:1.5px solid var(--linea);border-radius:14px;overflow:hidden;background:var(--hueso)}
  .esc-f{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    padding:13px 15px;border-bottom:1px solid var(--linea)}
  .esc-f:last-child{border-bottom:0}
  .esc-f .izq{font-size:14.5px;text-align:right;color:var(--navy)}
  .esc-f .der{font-size:14.5px;text-align:left;color:var(--navy)}
  .puntos{display:flex;gap:7px}
  .pt{width:26px;height:26px;border-radius:50%;border:2px solid #C3BDB0;background:var(--blanco);
    cursor:pointer;padding:0;transition:all .16s;font-size:0}
  .pt:hover{border-color:#A79F8E}
  .pt.on{border-color:var(--naranja);background:var(--naranja);transform:scale(1.1)}
  @media(max-width:480px){
    .esc-f{grid-template-columns:1fr;gap:7px;text-align:center}
    .esc-f .izq,.esc-f .der{text-align:center;font-size:14px;font-weight:600}
    .puntos{justify-content:center}
  }

  /* ── Navegación ── */
  .nav{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding-top:22px;border-top:1px solid var(--linea);margin-top:8px}
  .btn{font-family:inherit;font-size:15.5px;font-weight:600;padding:13px 26px;border-radius:12px;
    cursor:pointer;border:0;transition:background .2s,box-shadow .2s}
  .btn-sec{background:var(--blanco);border:1.5px solid var(--linea);color:var(--navy)}
  .btn-sec:hover{border-color:#CFC9BC}
  .btn-pri{background:var(--naranja-txt);color:var(--blanco);box-shadow:0 3px 13px rgba(188,86,31,.26)}
  .btn-pri:hover{background:var(--naranja-hover)}
  .btn-pri:disabled{background:var(--linea);color:#8B8575;box-shadow:none;cursor:not-allowed}
  .btn[hidden]{display:none}

  /* ── Enviando / fin ── */
  .centro{text-align:center;padding:56px 0 30px}
  .rueda{width:54px;height:54px;margin:0 auto 22px;border:3px solid var(--crema);
    border-top-color:var(--naranja);border-radius:50%;animation:gira .85s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .tilde{width:66px;height:66px;margin:0 auto 22px;border-radius:50%;background:rgba(122,148,85,.13);
    display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--oliva-txt)}
  .fin-txt{font-size:16.5px;color:var(--gris);line-height:1.7;max-width:420px;margin:0 auto}
  .pie{text-align:center;font-size:12.5px;color:#9A9486;margin-top:34px}
  .error{background:rgba(204,94,34,.07);border-left:3px solid var(--naranja);
    padding:14px 16px;border-radius:0 10px 10px 0;font-size:14.5px;margin-bottom:18px}
  .error[hidden]{display:none}
</style>
</head>
<body>

<div class="marco">

  <!-- ══ CABECERA ══ -->
  <div class="cab">
    <div class="marca">Mentes Abundantes</div>
    <div class="sello">Diagnóstico de oferta de valor</div>
    <div class="barra-fila">
      <div></div>
      <div class="paso" id="paso"></div>
    </div>
    <div class="barra"><i id="progreso"></i></div>
  </div>

  <!-- ══ CONTENIDO ══ -->
  <div id="lienzo"></div>

  <!-- ══ NAVEGACIÓN ══ -->
  <div class="nav" id="nav">
    <button class="btn btn-sec" id="atras" type="button">← Anterior</button>
    <button class="btn btn-pri" id="siguiente" type="button">Comenzar →</button>
  </div>

  <div class="pie">Desarrollado por Mercadeo MRR LLC</div>
</div>

<script>
/* ════════════════════════════════════════════════════
   PEGA AQUÍ LA URL DE TU APPS SCRIPT (termina en /exec)
   ════════════════════════════════════════════════════ */
var ENDPOINT = 'PEGAR_URL_AQUI';

var lienzo   = document.getElementById('lienzo');
var elPaso   = document.getElementById('paso');
var elProg   = document.getElementById('progreso');
var elNav    = document.getElementById('nav');
var btnAtras = document.getElementById('atras');
var btnSig   = document.getElementById('siguiente');

var TOTAL_SEC = 5;

/* ── Preguntas: el texto sale del diagnóstico de oferta de valor ── */
var PREGUNTAS = {
  q1: { etq:'¿Qué vendes y cuál es tu servicio o producto principal?',
        ayuda:'Dilo como se lo dirías a alguien en una fiesta. Un par de frases bastan.' },
  q2: { etq:'¿Qué quieres vender más?',
        ayuda:'Lo que te gustaría que la gente comprara más, aunque hoy no sea lo que más vendes.' },
  q3: { etq:'¿Quién necesita lo que ofreces?',
        ayuda:'Piensa en una persona concreta, no en un grupo grande. Edad, situación y, si para ti importa, dónde vive.' },
  q4: { etq:'¿Cuál es su problema más importante?',
        ayuda:'Lo que más le cuesta o lo que le quita el sueño. Si puedes, en sus propias palabras.' },
  q5: { etq:'¿Qué desea conseguir?',
        ayuda:'El resultado que sueña, no el servicio. Qué quiere tener, poder hacer o sentir.' },
  q6: { etq:'¿Qué cambia en la vida del cliente después de comprarte?',
        ayuda:'Cómo estaba antes y cómo está después. Lo que se nota en su día a día.' },
  q7: { etq:'¿Qué resultado concreto puedes ofrecer?',
        ayuda:'Algo que se pueda ver: una cita bien atendida, un documento traducido, una conversación sin miedo. Sin prometer resultados de salud.' },
  q8: { etq:'¿Por qué deberían elegirte?',
        ayuda:'Lo que tú tienes y otras personas no, aunque te parezca obvio.' },
  q9: { etq:'¿Qué haces diferente de tu competencia?',
        ayuda:'Si no sabes quién es tu competencia, escribe cómo resuelve hoy esa persona el mismo problema.' },
  q10: { etq:'¿Qué pruebas tienes de que tu solución funciona?',
         ayuda:'Certificación, años de práctica, testimonios con permiso, casos. Si todavía no tienes, dilo: también es una respuesta útil.' }
};

var SECCIONES = [
  { id:'intro' },
  { id:'s1', num:'Sección 1 de 5', titulo:'Tu negocio',
    sub:'Primero, lo que vendes hoy y lo que quisieras vender más.', preg:['q1','q2'] },
  { id:'s2', num:'Sección 2 de 5', titulo:'Tu cliente ideal',
    sub:'Una persona concreta, no un grupo grande.', preg:['q3','q4','q5'] },
  { id:'s3', num:'Sección 3 de 5', titulo:'Lo que cambia',
    sub:'Lo que pasa en la vida de esa persona cuando trabaja contigo.', preg:['q6','q7'] },
  { id:'s4', num:'Sección 4 de 5', titulo:'Por qué tú',
    sub:'Lo que te distingue y cómo lo demuestras.', preg:['q8','q9','q10'] },
  { id:'s5', num:'Sección 5 de 5', titulo:'Tu nombre',
    sub:'Último paso antes de enviar.', preg:[] },
  { id:'fin' }
];

var R = {};
var paso = 0;
var enviado = false;

function crear(tag, clase, texto){
  var e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function pedirSubida(){
  try { parent.postMessage({ rbjSubir:true }, '*'); } catch(e){}
  try { window.scrollTo(0,0); } catch(e){}
}

/* ── Render ── */
function pintar(){
  var s = SECCIONES[paso];
  lienzo.innerHTML = '';

  if (s.id === 'intro'){ pintarIntro(); }
  else if (s.id === 'fin'){ pintarEnvio(); }
  else { pintarSeccion(s); }

  if (s.id === 'intro' || s.id === 'fin'){
    elPaso.textContent = '';
    elProg.style.width = (s.id === 'fin' ? 100 : 0) + '%';
  } else {
    elPaso.textContent = paso + ' / ' + TOTAL_SEC;
    elProg.style.width = ((paso - 1) / TOTAL_SEC * 100 + (100 / TOTAL_SEC) * 0.15) + '%';
  }

  if (s.id === 'fin'){
    elNav.style.display = 'none';
  } else {
    elNav.style.display = 'flex';
    btnAtras.hidden = (paso === 0);
    btnSig.textContent = (s.id === 'intro') ? 'Comenzar →'
                       : (paso === SECCIONES.length - 2) ? 'Enviar mis respuestas ✦'
                       : 'Siguiente →';
    revisarSig();
  }
  pedirSubida();
}

/* Solo el nombre es obligatorio, y va al final */
function revisarSig(){
  var s = SECCIONES[paso];
  btnSig.disabled = (s.id === 's5' && !String(R.nombre || '').trim());
}

function pintarIntro(){
  var w = crear('div','bien');

  var d = crear('div','disco'); d.appendChild(crear('span','','✦')); w.appendChild(d);

  w.appendChild(crear('h1','','Tu oferta, en tus palabras'));

  w.appendChild(crear('p','entrada',
    'Steph, este es el diagnóstico de tu oferta de valor. Diez preguntas en cuatro bloques. ' +
    'Lo que escribas aquí es la base para encontrar a tu cliente ideal en nuestra sesión 3.'));

  w.appendChild(crear('div','pastilla','⏱ 25–30 minutos'));

  var av = crear('div','avisos');
  [
    'No hay respuestas correctas. Escribe como piensas, no como suena bonito.',
    'Un párrafo corto por pregunta es suficiente. Lo de fondo es lo que importa.',
    'Si una pregunta no la sabes contestar, déjala en blanco. Eso también me dice algo.',
    'Puedes ir y volver entre secciones con los botones de abajo.',
    'Lo único obligatorio es tu nombre, al final.'
  ].forEach(function(t){ av.appendChild(crear('p','',t)); });
  w.appendChild(av);

  lienzo.appendChild(w);
}

function pintarSeccion(s){
  var cab = crear('div','sec-cab');
  cab.appendChild(crear('div','sec-num', s.num));
  var h = crear('h2'); h.textContent = s.titulo; cab.appendChild(h);
  cab.appendChild(crear('p','sec-sub', s.sub));
  lienzo.appendChild(cab);

  s.preg.forEach(function(id){
    var q = PREGUNTAS[id];
    var box = crear('div','preg');
    box.appendChild(crear('div','etq', q.etq));
    box.appendChild(crear('p','ayuda', q.ayuda));
    var ta = crear('textarea');
    ta.id = id;
    ta.maxLength = 1000;
    ta.value = R[id] || '';
    ta.addEventListener('input', function(){ R[id] = ta.value; revisarSig(); });
    box.appendChild(ta);
    lienzo.appendChild(box);
  });

  if (s.id === 's5'){
    var box2 = crear('div','preg');
    box2.appendChild(crear('div','etq','¿Cómo te llamas?'));
    box2.appendChild(crear('p','ayuda','Es lo único obligatorio. Me sirve para saber de quién son estas respuestas.'));
    var inp = crear('input');
    inp.type = 'text';
    inp.id = 'nombre';
    inp.autocomplete = 'name';
    inp.maxLength = 120;
    inp.value = R.nombre || '';
    inp.addEventListener('input', function(){ R.nombre = inp.value; revisarSig(); });
    box2.appendChild(inp);
    lienzo.appendChild(box2);
  }
}

/* ── Envío por lotes: un lote por respuesta, cada uno con el mismo id ── */
function pintarEnvio(){
  var w = crear('div','centro');
  w.appendChild(crear('div','rueda'));
  var h = crear('h2'); h.textContent = 'Enviando tus respuestas…'; w.appendChild(h);
  w.appendChild(crear('p','fin-txt','Un momento, no cierres esta página.'));
  lienzo.appendChild(w);
  if (!enviado){ enviado = true; enviar(); }
}

function pintarFin(ok){
  lienzo.innerHTML = '';
  var w = crear('div','centro');
  w.appendChild(crear('div','tilde','✓'));
  var h = crear('h2');
  h.textContent = ok ? '¡Gracias, ' + String(R.nombre || '').split(' ')[0] + '!' : 'Listo';
  w.appendChild(h);
  w.appendChild(crear('p','fin-txt', ok
    ? 'Con esto ya puedo trabajar. Voy a leer tus respuestas con calma antes de nuestra sesión 3. ' +
      'Lo que dejaste en blanco lo resolvemos juntas.'
    : 'Tus respuestas quedaron registradas. Si algo no llegó, Krystina te escribe.'));
  lienzo.appendChild(w);
  elNav.style.display = 'none';
  pedirSubida();
}

function lotes(){
  var id = 'dv-' + Date.now() + '-' + Math.floor(Math.random()*9000 + 1000);
  var orden = ['nombre','q1','q2','q3','q4','q5','q6','q7','q8','q9','q10'];
  var L = orden.map(function(k){ var o = {}; o[k] = R[k] || ''; return o; });
  L[L.length - 1].fin = '1';
  return L.map(function(o){ o.id = id; return o; });
}

function aQuery(o){
  var partes = [];
  for (var k in o){ if (Object.prototype.hasOwnProperty.call(o, k)){
    partes.push(encodeURIComponent(k) + '=' + encodeURIComponent(String(o[k]).slice(0, 1800)));
  }}
  partes.push('t=' + Date.now());
  return partes.join('&');
}

function enviar(){
  if (!ENDPOINT || ENDPOINT.indexOf('PEGAR_URL') === 0){
    setTimeout(function(){ pintarFin(false); }, 900);
    return;
  }
  var L = lotes();
  var i = 0;
  var cerrado = false;

  function terminar(ok){
    if (cerrado) return;
    cerrado = true;
    pintarFin(ok !== false);
  }

  function siguienteLote(){
    if (i >= L.length){ terminar(true); return; }
    var o = L[i++];
    var ping = new Image();
    var listo = false;
    function paso2(){ if (listo) return; listo = true; setTimeout(siguienteLote, 60); }
    ping.onload  = paso2;
    ping.onerror = paso2;
    ping.src = ENDPOINT + '?' + aQuery(o);
    setTimeout(paso2, 3000);
  }

  siguienteLote();
  setTimeout(function(){ terminar(true); }, 60000);
}

/* ── Navegación ── */
btnSig.addEventListener('click', function(){
  if (btnSig.disabled) return;
  if (paso < SECCIONES.length - 1){ paso++; pintar(); }
});
btnAtras.addEventListener('click', function(){
  if (paso > 0){ paso--; pintar(); }
});

/* ── Altura del iframe: medir el BODY, nunca documentElement ── */
(function(){
  var ultimo = 0;
  function alto(){
    var h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h > 400 && Math.abs(h - ultimo) > 2){
      ultimo = h;
      try { parent.postMessage({ rbjAltura:h }, '*'); } catch(e){}
    }
  }
  window.addEventListener('load', alto);
  window.addEventListener('resize', alto);
  setInterval(alto, 800);
})();

pintar();
</script>
</body>
</html>
